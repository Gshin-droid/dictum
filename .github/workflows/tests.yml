# Прогон тестов при каждой отправке кода. Бесплатно для открытых репозиториев.
# Смысл не в бдительности над собой, а в том, что посетитель видит: код живой,
# тесты проходят, а не выложен и брошен.
name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Только Windows: программа перехватывает клавиатуру и рисует окно средствами
    # Windows, на других системах она не запускается в принципе.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONUTF8: "1"
